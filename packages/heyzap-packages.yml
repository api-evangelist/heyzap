generated: '2026-07-19'
method: searched
source: https://registry.npmjs.org/heyzap-cordova
note: >-
  Heyzap was a mobile-game advertising / monetization SDK company (acquired by
  Fyber, now part of Digital Turbine). It never shipped a public REST API; its
  developer surface was mobile ad-mediation SDKs (iOS, Android, Unity, Cordova,
  Adobe AIR/ANE). The heyzap.com domain is now parked/for-sale, and
  developers.heyzap.com no longer resolves. The first-party client libraries
  below are historical and unmaintained (last published 2022), preserved here
  from the npm registry and the github.com/Heyzap organization.
packages:
  - language: javascript
    registry: npm
    name: heyzap-cordova
    url: https://www.npmjs.com/package/heyzap-cordova
    install: cordova plugin add heyzap-cordova
    version: 1.5.1
    license: MIT
    official: true
    source_repo: https://github.com/Heyzap/heyzap-cordova
    description: Heyzap Ads SDK plugin for Apache Cordova / Adobe PhoneGap.
